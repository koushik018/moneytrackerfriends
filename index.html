* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { margin:0; font-family:'Jost',system-ui,sans-serif; font-weight:300; background:var(--bg); color:var(--text); padding-bottom:96px; letter-spacing:.01em; -webkit-font-smoothing:antialiased; transition:background .5s,color .5s; }
.serif, h1, h2, .big, .stat b { font-family:'Playfair Display',Georgia,serif; font-variant-numeric:lining-nums tabular-nums; }
.script { font-family:'Pinyon Script',cursive; font-weight:400; }
.eyebrow, .sub, label.f, th { text-transform:uppercase; letter-spacing:.14em; font-size:.66rem; font-weight:400; color:var(--muted); }
.sub { text-transform:none; letter-spacing:.02em; font-size:.8rem; }

/* ---- animated ambient background (+ optional real video at assets/bg.mp4) ---- */
#bg { position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg); }
#bg .orb { position:absolute; border-radius:50%; opacity:.55; will-change:transform; }
#bg .o1 { width:60vmax; height:60vmax; background:radial-gradient(closest-side,var(--glow1),transparent); left:-15vmax; top:-20vmax; animation:drift1 38s ease-in-out infinite alternate; }
#bg .o2 { width:50vmax; height:50vmax; background:radial-gradient(closest-side,var(--glow2),transparent); right:-18vmax; bottom:-18vmax; animation:drift2 46s ease-in-out infinite alternate; }
#bg .o3 { width:34vmax; height:34vmax; background:radial-gradient(closest-side,var(--glow1),transparent); left:40%; top:35%; opacity:.28; animation:drift3 52s ease-in-out infinite alternate; }
#bgv { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.6s; filter:saturate(.8) brightness(.7); }
#bgv.on { opacity:.9; }
#bg .veil { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 0%, transparent 0%, var(--ov) 70%), linear-gradient(var(--ov), var(--ov)); }
#bg .grain { position:absolute; inset:-50%; opacity:.07; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation:grain 1.2s steps(6) infinite; }
body.plainbg #bg .orb, body.plainbg #bg .grain, body.plainbg #bgv { display:none; }
@keyframes drift1 { to { transform:translate(18vmax,14vmax) scale(1.15); } }
@keyframes drift2 { to { transform:translate(-20vmax,-12vmax) scale(.9); } }
@keyframes drift3 { to { transform:translate(-14vmax,10vmax) scale(1.25); } }
@keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-2%)} 100%{transform:translate(3%,3%)} }
@media (prefers-reduced-motion:reduce) { #bg .orb, #bg .grain { animation:none; } #bgv { display:none; } }

/* ---- header ---- */
header { position:sticky; top:0; z-index:50; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:linear-gradient(var(--ov),transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
header h1 { margin:0; font-weight:400; font-size:1.7rem; line-height:1; cursor:pointer; display:flex; align-items:baseline; gap:10px; }
header h1 small { font-family:'Jost'; font-size:.6rem; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); }
header .hr { display:flex; gap:12px; align-items:center; white-space:nowrap; }
header .eyebrow { font-size:.6rem; }
main { max-width:980px; margin:0 auto; padding:18px 16px; display:grid; gap:22px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:22px; }

/* ---- surfaces ---- */
.card { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:22px; display:flex; flex-direction:column; gap:16px; min-width:0; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 20px 50px -20px var(--shadow); }
.card h2 { margin:0; font-size:1.25rem; font-weight:500; display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.card h2 .sub { font-family:'Jost'; }
input, select, textarea { width:100%; background:var(--input); border:none; border-bottom:1px solid var(--border); color:var(--text); padding:12px 10px; border-radius:2px 2px 0 0; outline:none; min-width:0; font:inherit; font-weight:300; transition:border-color .3s, background .3s; }
input:focus, select:focus { border-bottom-color:var(--accent); background:rgba(255,255,255,.06); }
select option { background:var(--solid); color:var(--text); }
input[type=checkbox] { accent-color:var(--accent); }
label.f { display:flex; flex-direction:column; gap:2px; flex:1; min-width:120px; }
.row { display:flex; gap:14px; flex-wrap:wrap; }
button { border:1px solid var(--border); border-radius:2px; padding:11px 18px; background:transparent; color:var(--text); font:inherit; font-size:.7rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; transition:all .25s; }
button:hover { border-color:var(--accent); color:var(--accent); }
button.pri { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
button.pri:hover { filter:brightness(1.08); color:var(--accent-text); }

/* ---- premium control polish ---- */

select { -webkit-appearance:none; appearance:none; padding-right:30px; cursor:pointer; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%23999' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; }

/* modal: refined header with close button, sticky action row */

/* ---------- state ---------- */
let S, V = { reveal:{}, hideNow:false, pt:'fixed', tab:'home', month:ym(Date.now()), q:'', ftype:'all', f:{type:'expense',mode:'qr',touched:false} };
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const qs = s => esc(String(s ?? '').replace(/\\/g,'\\\\')).replace(/&#39;/g,'\\&#39;');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => (n < 0 ? '-' : '') + '₹' + Math.abs(Math.round(n*100)/100).toLocaleString('en-IN', {maximumFractionDigits:2});
const $ = id => document.getElementById(id);
function ym(ts){ const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function ymLabel(m){ const [y,mo] = m.split('-'); return new Date(y, mo-1, 1).toLocaleString('en-IN',{month:'long',year:'numeric'}); }
function shiftYm(m, n){ const [y,mo] = m.split('-').map(Number); return ym(new Date(y, mo-1+n, 1)); }
function dayIn(y, m, d, end){ const dt = new Date(y, m, Math.min(d, new Date(y, m+1, 0).getDate())); if(end) dt.setHours(23,59,59,999); return dt; }
const fdt = ts => { const d = new Date(ts); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ', ' + d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}); };
const masked = a => { if(a && a.type==='invest' && !V.invOk) return true; const rv = a && (V.reveal||{})[a.id]; if(rv===true) return false; if(rv===false) return true; return !!V.hideNow || !!(a && a.priv && a.type!=='invest'); };
const mi = (n, a) => masked(a) ? '₹ ••••' : inr(n);
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fdate = ts => new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
function blank(){ return { v:2, userName:'', theme:'noir', accounts:[], methods:[], txns:[], plans:[], reminders:[], fixed:[], budgets:{}, cats:[], people:[], migrated:false }; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save (storage full or blocked)'); } if(typeof queueSnap==='function') queueSnap(); if(typeof queueNotifs==='function') queueNotifs(); }

/* ---------- lookups ---------- */
const acc = id => S.accounts.find(a => a.id === id) || (S.vaultAccs || []).find(a => a.id === id);
const anm = id => { const a = acc(id); return !a ? '' : (a.type==='vault' && !V.vaultOk) ? 'Private' : a.name; };   // vault names never show in history
const meth = id => S.methods.find(m => m.id === id);
const live = () => S.txns.filter(t => !t.reverted);
function guessCat(d){
  d = (d||'').toLowerCase();
  if(/cash\s?back|cahsback/.test(d)) return 'Cashback';
  if(/petrol|peteol|diesel|fuel/.test(d)) return 'Fuel';
  if(/auto|rapido|uber|ola|bus|metro|train|cab|ticket|luggage|baggage|parcel/.test(d)) return 'Transport';
  if(/swiggy|zomato|dhaba|tiffin|food|lunch|dinner|tea|coffee|treat|biryani|hotel|restaurant|snack/.test(d)) return 'Food';
  if(/housing|rent|pg\b|maintenance/.test(d)) return 'Housing';
  if(/amma|akka|pinni|family|dad|mom|appa/.test(d)) return 'Family';
  if(/recharge|bill|electric|wifi|broadband|xerox|print|insurance|emi/.test(d)) return 'Bills';
  if(/medic|pharma|doctor|hospital/.test(d)) return 'Health';
  if(/movie|netflix|game|trip|fun/.test(d)) return 'Fun';
  if(/amazon|flipkart|shop|cloth|mall|store|rapiso|rapisso/.test(d)) return 'Shopping';
  return 'Other';
}

/* ---------- balances (always DERIVED from transactions, so revert can never corrupt them) ---------- */
function eff(t, id){
  if(t.reverted) return 0;
  if(t.type==='expense') return t.from===id ? -t.amount : 0;
  if(t.type==='income' || t.type==='adjust') return t.to===id ? t.amount : 0;
  if(t.type==='transfer') return (t.from===id ? -t.amount : 0) + (t.to===id ? t.amount : 0);
  if(t.type==='hold') return 0;   // IPO: balance still shows it (like the bank SMS); it is only blocked from spending, decided on the debit/unblock day
  if(t.type==='invest') return t.from===id ? -t.amount : 0;                   // IPO allotted: money became shares
  return 0;
}
function net(id, upTo=Infinity){ const a = acc(id); return (a.opening||0) + S.txns.reduce((s,t) => t.ts<=upTo ? s+eff(t,id) : s, 0); }
function avail(a){ return a.type==='credit' ? (a.limit||0) + net(a.id) : net(a.id) - (a.minBal||0) - holdTotal(a.id); }   // what can safely be spent
function cls(t){
  if(t.ledger) return 'transfer';
  if(t.type==='hold' || t.type==='invest') return 'transfer';
  if(t.type!=='transfer') return t.type;
  if(acc(t.from)?.type==='external') return 'income';
  if(acc(t.to)?.type==='external') return 'expense';
  return 'transfer';
}

/* ---------- cashback ---------- */
function monthCb(mid, m, skip){ return live().filter(t => t.methodId===mid && t.cb && ym(t.ts)===m && t.id!==skip).reduce((s,t)=>s+t.cb,0); }
function calcCb(m, amount, mode, ts){
  const r = m.cb; if(!r || !r.pct || !(r.modes||[]).includes(mode)) return 0;
  let c = amount * r.pct / 100;
  if(r.txnCap) c = Math.min(c, r.txnCap);
  if(r.monthCap) c = Math.min(c, r.monthCap - monthCb(m.id, ym(ts)));
  return Math.max(0, Math.round(c*100)/100);
}
function capLeft(m, month){ return m.cb?.monthCap ? Math.max(0, m.cb.monthCap - monthCb(m.id, month)) : null; }

/* ---------- "which should I pay with?" ---------- */
function suggest(mode, amount, ts, tap){
  const rows = S.methods.filter(m => !m.inactive && acc(m.accountId) && acc(m.accountId).type!=='invest' && !acc(m.accountId).inactive && m.modes.includes(mode)).map(m => {
    const a = acc(m.accountId), cb = calcCb(m, amount, mode, ts), sp = avail(a);
    let why = '';
    if(cb > 0){ const left = capLeft(m, ym(ts)); why = `earns <b>${inr(cb)}</b> cashback` + (left!==null ? ` (${inr(left)} of monthly cap left)` : ''); }
    else if(m.cb?.pct && !(m.cb.modes||[]).includes(mode)) why = 'no cashback on this type of payment';
    else if(m.cb?.pct && m.cb.monthCap && capLeft(m, ym(ts)) === 0) why = 'monthly cashback cap already used';
    else why = 'no cashback';
    if(a.type==='credit') why += ' · adds to your bill (pay by due date)';
    const lim = m.kind==='upi' && a.type==='bank' && a.upiLimit ? a.upiLimit - upiUsed(a, ts) : Infinity;
    if(lim < amount) why += ` · over today's UPI limit (${inr(Math.max(0,lim))} left)`;
    const cl = limitLeft(m, mode, amount, tap, ts);
    if(cl < amount) why += cl < 0 ? ' · over this card\'s contactless limit' : ` · over today's card limit (${inr(Math.max(0,cl))} left)`;
    return { m, a, cb, sp, ok: sp >= amount && lim >= amount && cl >= amount, why };
  });
  rows.sort((x,y) => (y.ok-x.ok) || (y.cb-x.cb) || (y.sp-x.sp));
  return rows;
}

/* ---------- credit card statement logic ---------- */
function stmt(a, now = new Date()){
  if(a.type!=='credit' || !a.billDay) return null;
  let end = dayIn(now.getFullYear(), now.getMonth(), a.billDay, true);
  if(end > now) end = dayIn(now.getFullYear(), now.getMonth()-1, a.billDay, true);
  const due = dayIn(end.getFullYear(), end.getMonth() + ((a.dueDay||0) <= a.billDay ? 1 : 0), a.dueDay || a.billDay, true);
  const billed = Math.max(0, -net(a.id, end.getTime()));
  const minDue = Math.ceil(billed * (a.minDuePct||10) / 100);
  const paid = live().filter(t => t.ts > end.getTime() && ((t.type==='transfer' && t.to===a.id) || (t.type==='income' && t.to===a.id))).reduce((s,t)=>s+t.amount,0);
  return { end, due, billed, minDue, paid, remMin: Math.max(0, minDue - paid), remAll: Math.max(0, billed - paid),
           next: dayIn(end.getFullYear(), end.getMonth()+1, a.billDay, true), days: Math.ceil((due - now) / 864e5) };
}

/* ---------- alerts / reminders ---------- */
function alerts(){
  const out = [], now = new Date(), cm = ym(now), today = now.getDate();
  S.accounts.filter(a => a.type==='credit' && !a.inactive).forEach(a => {
    const s = stmt(a); if(!s) return;
    if(s.billed > 0 && s.remMin > 0) out.push({ lv: s.days<0?'red':s.days<=5?'red':'', t:`${a.name}: pay at least ${inr(s.remMin)} by ${fdate(s.due)}`, s:`${s.days<0?'OVERDUE by '+(-s.days)+' day(s)':'Due in '+s.days+' day(s)'} · statement ${inr(s.billed)} · full payment ${inr(s.remAll)} avoids all interest`, act:`<button class="sm good" onclick="payBill('${a.id}')">Pay now</button>` });
    else if(s.billed > 0 && s.remAll > 0) out.push({ lv:'blue', t:`${a.name}: minimum paid ✔`, s:`Remaining ${inr(s.remAll)} – pay by ${fdate(s.due)} to avoid interest`, act:`<button class="sm" onclick="payBill('${a.id}')">Pay rest</button>` });
    const used = -net(a.id); if(used > 0 && s.billed === 0) out.push({ lv:'blue', t:`${a.name}: ${inr(used)} used this cycle`, s:`Next statement ${fdate(s.next)}` });
  });
  S.reminders.forEach(r => {
    if(r.done?.[cm]) return;
    if(r.autoAmt && r.accountId){   // done automatically once the month's credit is recorded
      const got = live().filter(t => ym(t.ts)===cm && t.to===r.accountId && (t.type==='income' || t.type==='transfer')).reduce((x,t)=>x+t.amount,0);
      if(got >= r.autoAmt){ r.done = r.done||{}; r.done[cm] = true; save(); return; }
    }
    const diff = r.day - today;
    if(diff <= 5) out.push({ lv: diff<0?'red':'', t:r.title, s: diff<0 ? `Was due on the ${r.day}th – still not done` : diff===0 ? 'Due today' : `Due in ${diff} day(s) (${r.day}th)`,
      act: r.autoAmt && r.accountId ? `<button class="sm good" onclick="topupModal('${r.id}')">Record</button>` : `<button class="sm good" onclick="remDone('${r.id}')">Done</button>` });
  });
  S.accounts.filter(a => !a.inactive && a.type!=='external' && a.type!=='credit' && a.type!=='invest').forEach(a => {
    const bal = net(a.id);
    if(a.type==='bank' && a.upiLimit && ntOn('upi') && upiUsed(a) >= a.upiLimit) out.push({ lv:'red', t:`${a.name}: UPI daily limit reached`, s:'No more UPI payments from this bank today – use a card or another bank.' });
    if(a.minBal && bal < a.minBal) out.push({ lv:'red', t:`${a.name} is below minimum balance`, s:`Balance ${inr(bal)} · minimum ${inr(a.minBal)}` });
  });
  const stale = S.accounts.filter(a => !a.inactive && (a.type==='bank'||a.type==='cash') && (!a.checkedAt || Date.now()-a.checkedAt > 7*864e5));
  if(stale.length && S.accounts.length) out.push({ lv:'blue', t:'Time to update balances', s:'Compare with your bank / UPI apps so the tracker stays accurate: ' + stale.map(a => a.name).join(', '), act:`<button class="sm" onclick="V.tab='accounts';render()">Check</button>` });
  const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  if(dim - today <= 5) S.methods.filter(m => !m.inactive && m.cb?.monthCap).forEach(m => { const l = capLeft(m, cm); if(l > 0) out.push({ lv:'blue', t:`${inr(l)} cashback cap unused on ${m.name}`, s:`${dim-today} day(s) left this month – use this card for eligible spends` }); });
  S.plans.filter(p => !p.done && p.due && new Date(p.due) - now < 3*864e5).forEach(p => out.push({ lv:'', t:`Planned: ${p.desc} ${inr(p.amount)}`, s:'Due ' + fdate(new Date(p.due)) }));
  (S.ipos || []).filter(o => o.status==='pending').forEach(o => { const t = ISO(now); if(o.allot && o.allot <= t) out.push({ lv: o.unblock && o.unblock < t ? 'red' : '', t:`IPO allotment: ${o.name}`, s: `${inr(o.amount)} on hold in ${acc(o.from)?.name || 'your account'}. ` + (o.allot===t ? 'Allotment is today – check your app.' : 'Allotment is out.') + ` Funds are debited (allotted) or unblocked (not allotted) on ${o.unblock ? fdate(new Date(o.unblock + 'T00:00:00')) : 'the unblock day'}.`, act:`<button class="sm good" onclick="ensureInvest(()=>ipoResult('${o.id}','ask'))">Allotted</button> <button class="sm" onclick="ensureInvest(()=>ipoResult('${o.id}',0))">Not allotted</button>` }); });
  S.accounts.filter(a => a.type==='invest' && a.raa && a.raa.cycle!=='off' && a.raa.next).forEach(a => { const r = a.raa, days = Math.round((new Date(r.next + 'T00:00:00') - new Date(ISO(now) + 'T00:00:00')) / 864e5), free = raaFree(a);
    if(days < 0 && free <= 0.004){ const step = r.cycle==='quarterly' ? 3 : 1; while(r.next < ISO(now)) r.next = addMonths(r.next, step); save(); return; }
    if(days <= 2 && free > 0.004) out.push({ lv: days < 0 ? 'red' : 'blue', t:`${a.name} auto-refund ${days < 0 ? 'was due' : days===0 ? 'today' : 'in ' + days + ' day(s)'}`, s:`Unused balance goes back to ${acc(r.bank)?.name || 'your primary bank'} on ${fdate(new Date(r.next + 'T00:00:00'))}. Keep it there only if you will trade or apply for an IPO before then.`, act:`<button class="sm good" onclick="ensureInvest(()=>raaRecord('${a.id}'))">Record refund</button>` }); });
  // fixed costs / autopay / EMI
  fxDue(60).forEach(x => { if(x.days > (x.f.remindDays ?? 5)) return;
    const a = acc(meth(x.f.methodId)?.accountId), what = x.f.emi ? 'EMI' : 'Autopay';
    if(x.f.auto) out.push(a && avail(a) < x.f.amount ? { lv:'red', t:`${what} ${x.f.title}: ${inr(fxAmt(x.f, x.k))} on ${fdate(x.d)}`, s:`Low balance in ${a.name} (${inr(avail(a))} available) – add money before the date` } : { lv:'blue', t:`${what} ${x.f.title}: ${inr(fxAmt(x.f, x.k))}`, s:`Recorded automatically on ${fdate(x.d)}` });
    else out.push({ lv: x.days<=1 ? 'red' : '', t:`${x.f.title}: ${inr(fxAmt(x.f, x.k))}`, s: x.days<0 ? `OVERDUE by ${-x.days} day(s)` : x.days===0 ? 'Due today' : `Due in ${x.days} day(s) · ${fdate(x.d)}`, act:`<button class="sm good" onclick="payFx('${x.f.id}','${x.k}')">Pay</button>` }); });
  // budgets
  const bud = S.budgets || {}, mm = ym(now), spendBy = {}; let totalSpent = 0;
  live().filter(t => ym(t.ts)===mm && cls(t)==='expense').forEach(t => { spendBy[t.cat||'Other'] = (spendBy[t.cat||'Other']||0) + t.amount; totalSpent += t.amount; });
  Object.keys(bud).filter(c => bud[c] > 0).forEach(c => { const sp = c==='_total' ? totalSpent : (spendBy[c]||0), r = sp / bud[c];
    if(r >= 0.8) out.push({ lv: r>=1 ? 'red' : '', t:`Budget ${c==='_total'?'(overall)':c}: ${inr(sp)} of ${inr(bud[c])}`, s: r>=1 ? 'Limit reached' : `${Math.round(r*100)}% used this month` }); });
  // UPI daily limit
  S.accounts.filter(a => a.type==='bank' && a.upiLimit && !a.inactive).forEach(a => { const u = upiUsed(a); if(u >= a.upiLimit*0.8) out.push({ lv: u>=a.upiLimit ? 'red' : '', t:`${a.name}: UPI limit for today`, s:`${inr(u)} used of ${inr(a.upiLimit)}` }); });
  return out;
}

}

function render(){
  if(V.tab==='vault' && !V.vaultOk) V.tab = 'home';
  if(V.tab!=='vault') V.vaultOk = false;
  if(!(V.tab==='plan' && (V.pt||'fixed')==='people')){ V.peopleOk = false; V.adj = false; }

function postExpense(o){

  const cb = o.cbOverride!=null && !isNaN(o.cbOverride) ? o.cbOverride : calcCb(o.m, o.amount, o.mode, o.ts);
  const t = { id:uid(), ts:o.ts, type:'expense', amount:o.amount, desc:o.desc, cat:o.cat, methodId:o.m.id, from:a.id, mode:o.mode, app:o.app||'', cb };
  if(o.tap) t.tap = true;
  if(o.vendor) t.vendor = o.vendor;
  if(o.planRef) t.planRef = o.planRef;
  S.txns.push(t); save(); return t;

function rInsights(){
  const m = V.month, L = live().filter(t => ym(t.ts)===m);
  const ex = L.filter(t => cls(t)==='expense'), inc = L.filter(t => cls(t)==='income');
  const spent = ex.reduce((s,t)=>s+t.amount,0), got = inc.reduce((s,t)=>s+t.amount,0), cb = L.reduce((s,t)=>s+(t.cb||0),0);
  const byCat = {}; ex.forEach(t => { const c = t.cat||'Other'; byCat[c] = (byCat[c]||0) + t.amount; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const byM = {}; ex.forEach(t => { const k = meth(t.methodId)?.name || acc(t.from)?.name || 'Other'; byM[k] = (byM[k]||0)+t.amount; });
  const payees = {}; ex.forEach(t => { const k = t.desc.trim().toLowerCase(); payees[k] = payees[k] || { n:t.desc.trim(), v:0, c:0 }; payees[k].v += t.amount; payees[k].c++; });
  const top = Object.values(payees).sort((a,b)=>b.v-a.v).slice(0,5);
  // donut
  let off = 0; const R = 50, C = 2*Math.PI*R;
  const donut = cats.length ? `<svg width="150" height="150" viewBox="0 0 150 150"><g transform="rotate(-90 75 75)">${cats.map(([c,v],i) => { const len = v/spent*C, s = `<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--c${i%8+1})" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('')}</g><text x="75" y="72" text-anchor="middle" fill="var(--muted)" font-size="10">Spent</text><text x="75" y="90" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="800">${inr(spent)}</text></svg>` : '<div class="empty">No spends this month.</div>';
  // 6-month trend
  const ms = [-5,-4,-3,-2,-1,0].map(n => shiftYm(m, n));
  const tr = ms.map(k => { const l = live().filter(t => ym(t.ts)===k); return { k, e:l.filter(t=>cls(t)==='expense').reduce((s,t)=>s+t.amount,0), i:l.filter(t=>cls(t)==='income').reduce((s,t)=>s+t.amount,0) }; });
  const mx = Math.max(1, ...tr.map(x => Math.max(x.e, x.i)));
  // cashback meters + missed estimate
  const cbm = S.methods.filter(x => x.cb?.pct && !x.inactive).map(x => { const e = monthCb(x.id, m), cap = x.cb.monthCap; return `<div><div style="display:flex;justify-content:space-between"><b>${esc(x.name)}</b><span>${inr(e)}${cap?' / '+inr(cap):''}</span></div>${cap?`<div class="bar"><i style="width:${Math.min(100,e/cap*100)}%"></i></div><div class="sub">${cap-e>0?inr(cap-e)+' of this month\'s cap still unused':'cap fully used'}</div>`:`<div class="sub">${x.cb.pct}% on eligible spends</div>`}</div>`; }).join('');
  const missed = estMissed(m);
  const cbPct = spent ? (cb/spent*100).toFixed(1) : '0';
  return `<div class="card"><h2>Insights <span><button class="sm" onclick="V.month=shiftYm(V.month,-1);render()">◀</button> ${ymLabel(m)} <button class="sm" onclick="V.month=shiftYm(V.month,1);render()">▶</button></span></h2>
  <div class="stats"><div class="stat"><span class="sub">Received</span><b class="pos">${inr(got)}</b></div><div class="stat"><span class="sub">Spent</span><b class="neg">${inr(spent)}</b></div><div class="stat"><span class="sub">Saved (received − spent)</span><b class="${got-spent<0?'neg':'pos'}">${inr(got-spent)}</b></div><div class="stat"><span class="sub">Cashback earned</span><b class="pos">${inr(cb)}</b><span class="sub">${cbPct}% of spend</span></div></div></div>
  <div class="grid2"><div class="card"><h2>Where the money went</h2><div class="donutwrap">${donut}<div class="leg">${cats.map(([c,v],i)=>`<div><i style="background:var(--c${i%8+1})"></i>${CATS[c]||''} ${c} · ${inr(v)} (${Math.round(v/spent*100)}%)</div>`).join('')}</div></div></div>
  <div class="card"><h2>Last 6 months</h2><div class="trend">${tr.map(x=>`<div><div class="pair"><i title="Received" style="height:${x.i/mx*100}%;background:var(--c3)"></i><i title="Spent" style="height:${x.e/mx*100}%;background:var(--c4)"></i></div>${new Date(x.k+'-01').toLocaleString('en-IN',{month:'short'})}</div>`).join('')}</div><div class="sub"><i style="background:var(--c3);display:inline-block;width:10px;height:10px;border-radius:3px"></i> Received &nbsp; <i style="background:var(--c4);display:inline-block;width:10px;height:10px;border-radius:3px"></i> Spent</div></div></div>
  <div class="grid2"><div class="card"><h2>Cashback usage</h2><div class="list">${cbm || '<div class="empty">No cashback rules yet (add in Accounts → Payment methods).</div>'}</div>${missed}</div>
  <div class="card"><h2>Spend by method</h2><div class="list">${Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<div><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${inr(v)}</b></div><div class="bar"><i style="width:${v/spent*100}%;background:var(--c${i%8+1})"></i></div></div>`).join('') || '<div class="empty">—</div>'}</div>
  <h2 style="margin-top:6px">Top spends</h2><div class="list">${top.map(p=>`<div class="item"><span class="t">${esc(p.n)} <span class="sub">×${p.c}</span></span><b>${inr(p.v)}</b></div>`).join('') || '<div class="empty">—</div>'}</div></div></div>`;
}
function estMissed(m){
  const cands = S.methods.filter(x => x.cb?.pct && !x.inactive);
  const L = live().filter(t => ym(t.ts)===m && t.type==='expense' && !t.cb && t.mode && t.mode!=='p2p');

/* ---------- floating calculator ---------- */
const CX = { e:'', hist:[] };
function calcEval(src){
  const t = [], re = /\s*(\d+\.?\d*|\.\d+|[-+×÷*\/()%])/y; let m, i = 0;
  src = String(src).replace(/,/g,'');
  while(i < src.length){ re.lastIndex = i; m = re.exec(src); if(!m) return NaN; t.push(m[1]); i = re.lastIndex; if(/^\s*$/.test(src.slice(i))) break; }
  let k = 0; const peek = () => t[k], eat = () => t[k++];
  function factor(){
    const x = peek();
    if(x === '-'){ eat(); const f = factor(); return { v:-f.v, raw:-f.raw, pct:f.pct }; }
    if(x === '+'){ eat(); return factor(); }
    let f;
    if(x === '('){ eat(); f = { v:expr().v }; if(eat() !== ')') throw 0; f.raw = f.v; }
    else if(x !== undefined && /^[\d.]/.test(x)){ eat(); f = { v:parseFloat(x) }; f.raw = f.v; }
    else throw 0;
    while(peek() === '%'){ eat(); f = { v:f.v/100, raw:f.v, pct:true }; }
    return f;
  }
  function term(){
    let a = factor();
    while(peek()==='×' || peek()==='*' || peek()==='÷' || peek()==='/'){
      const o = eat(), b = factor();
      if(o==='÷' || o==='/'){ if(b.v === 0) throw 0; a = { v:a.v / b.v }; } else a = { v:a.v * b.v };
      a.raw = a.v;
    }
    return a;
  }
  function expr(){
    let a = term();
    while(peek()==='+' || peek()==='-'){
      const o = eat(), b = term(), add = b.pct ? a.v * b.raw / 100 : b.v;
      a = { v: o==='+' ? a.v + add : a.v - add }; a.raw = a.v;
    }
    return a;
  }
  try{ const r = expr(); if(k < t.length) return NaN; return Math.round(r.v * 1e8) / 1e8; }catch(e){ return NaN; }
}
function calcDraw(){
  const sh = CX.e.replace(/\*/g,'×').replace(/\//g,'÷');
  $('cx_e').textContent = sh || '0';
  const v = CX.e ? calcEval(CX.e) : NaN;
  $('cx_r').textContent = Number.isFinite(v) && /[-+×÷*\/%]/.test(CX.e.replace(/^-/,'')) ? '= ' + Number(v).toLocaleString('en-IN',{maximumFractionDigits:8}) : '';
  $('cx_h').innerHTML = CX.hist.slice(-3).map(h => esc(h)).join('<br>');
}
function calcKey(k){
  if(k === 'C') CX.e = '';
  else if(k === '⌫') CX.e = CX.e.slice(0,-1);
  else if(k === '='){ const v = calcEval(CX.e); if(Number.isFinite(v)){ CX.hist.push(CX.e.replace(/\*/g,'×').replace(/\//g,'÷') + ' = ' + v); CX.e = String(v); } else toast('Check the sum'); }
  else {
    const last = CX.e.slice(-1), isOp = c => /[+×÷\-]/.test(c);
    if(isOp(k) && !CX.e && k !== '-') return;
    if(isOp(k) && isOp(last)) CX.e = CX.e.slice(0,-1);
    CX.e += k;
  }
  calcDraw();
}
function calcOpen(){
  const keys = ['C','(',')','÷','7','8','9','×','4','5','6','-','1','2','3','+','%','0','.','⌫'];
  $('cx_k').innerHTML = keys.map(k => `<button class="${'÷×-+%'.includes(k)?'op':''}${k==='C'?' bad':''}" onclick="calcKey('${k}')">${k}</button>`).join('') + '<button class="eq" style="grid-column:1/-1" onclick="calcKey(\'=\')">=</button>';
  $('calc').classList.add('on'); calcDraw();
}
function calcClose(){ $('calc').classList.remove('on'); }
function calcValue(){ const v = calcEval(CX.e); return Number.isFinite(v) ? v : NaN; }
function calcUse(){
  const v = calcValue(); if(!Number.isFinite(v)){ toast('Nothing to use yet'); return; }
  const ids = ['a_amt','pp_v','fx_a','h_amt','c_a','rw_v','ci_v'];
  let el = ids.map(i => $(i)).find(e => e && !e.disabled);
  if(!el && !$('modal').classList.contains('on')){ V.tab = 'add'; render(); el = $('a_amt'); }
  if(!el){ toast('No amount box open – copied instead'); calcCopy(); return; }
  el.value = Math.abs(v); el.dispatchEvent(new Event('input',{bubbles:true})); calcClose(); toast('Amount filled: ' + inr(Math.abs(v)));
}
function calcCopy(){ const v = calcValue(); if(!Number.isFinite(v)){ toast('Nothing to copy'); return; } try{ navigator.clipboard.writeText(String(v)).then(() => toast('Copied ' + v), () => toast('Result: ' + v)); }catch(e){ toast('Result: ' + v); } }
document.addEventListener('keydown', e => {
  if(!$('calc').classList.contains('on') || e.ctrlKey || e.metaKey) return;
  if(e.key === 'Escape') return calcClose();
  if(e.key === 'Enter'){ e.preventDefault(); return calcKey('='); }
  if(e.key === 'Backspace') return calcKey('⌫');
  if(/^[0-9.()%+\-]$/.test(e.key)) calcKey(e.key); else if(e.key==='*'||e.key==='x') calcKey('×'); else if(e.key==='/'){ e.preventDefault(); calcKey('÷'); }
});

function migrate(old){
  const s = blank(); s.userName = old.userName || ''; s.migrated = true;
  const byName = {}, mByAcc = {};
  (old.accounts||[]).forEach(o => {
    const l = (o.name||'').toLowerCase();
    const type = /cashback/.test(l) ? 'wallet' : /^cash\b/.test(l) ? 'cash' : /^(others?|family)/.test(l) ? 'external' : 'bank';
    const a = { id:uid(), name:o.name, type, opening:+o.initial||0, minBal:0, checkedAt:0 };
    s.accounts.push(a); byName[o.name] = a;
    if(type==='bank' || type==='cash'){ const m = { id:uid(), name:o.name, kind:type==='cash'?'cash':'upi', accountId:a.id, modes:type==='cash'?['p2p','pos']:['p2p','qr'], cb:{} }; s.methods.push(m); mByAcc[a.id] = m; }
  });
  const total = (old.expenses||[]).length, base = Date.now() - total*60000, planMap = {};
  S = s;   // so cls()/net() work during replay
  (old.pendingCosts||[]).forEach((p,i) => { const a = byName[p.account]; const pl = { id:uid(), desc:p.desc, amount:+p.amount||0, methodId:a && mByAcc[a.id] ? mByAcc[a.id].id : null, mode:'qr', cat:guessCat(p.desc), due:null, done:!!p.done }; s.plans.push(pl); planMap[i] = pl; });
  (old.expenses||[]).forEach((e,i) => {
    const f = byName[e.account], to = e.toAccount ? byName[e.toAccount] : null;
    const t = { id:uid(), ts:base + i*60000, desc:e.description, amount:+e.amount||0, cat:guessCat(e.description), legacy:true, fromName:e.account, toName:e.toAccount };
    if(to){ t.type = 'transfer'; t.from = f?.id; t.to = to.id; if(to.type==='wallet' || f?.type==='external') t.cat = /cash/i.test(t.desc) ? 'Cashback' : (t.cat==='Other'?'Family':t.cat); }
    else { t.type = 'expense'; t.from = f?.id; t.methodId = f && mByAcc[f.id]?.id; t.mode = 'qr'; t.cb = 0; }
    if(e.pendingRef!=null && planMap[e.pendingRef]){ t.planRef = planMap[e.pendingRef].id; planMap[e.pendingRef].txnId = t.id; }
    s.txns.push(t);
  });
  // make the new derived balances match exactly what the old app showed
  (old.accounts||[]).forEach(o => { const a = byName[o.name]; const diff = (+o.current||0) - net(a.id); if(Math.abs(diff) > .004) s.txns.push({ id:uid(), ts:Date.now(), type:'adjust', amount:Math.round(diff*100)/100, desc:'Balance correction (imported)', cat:'Other', to:a.id, legacy:true }); });
  return s;
}

function autoRecord(){

function fxDue(horizon){   // unpaid occurrences that are overdue or due within `horizon` days
  const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), lim = new Date(t0.getTime() + horizon*864e5 + 864e5 - 1), out = [];

      if(f.auto && d <= now) return;   // autoRecord handles these

const FX_PER = { d:365, w:52, m:12, q:4, y:1 }, FX_NAME = { d:'Day', w:'Week', m:'Month', q:'Quarter', y:'Year' }, FX_LONG = { d:'Daily', w:'Weekly', m:'Monthly', q:'Quarterly', y:'Yearly' };

/* ---------- investments: FD / RD maths (quarterly compounding, checked to the paisa) ---------- */
const dateOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear())*12 + (b.getMonth() - a.getMonth()) + (b.getDate() - a.getDate())/30.4375;
function fdMaturity(P, ratePct, months, comp = 4){ const r = ratePct/100, t = months/12; return comp ? P*Math.pow(1 + r/comp, comp*t) : P*(1 + r*t); }
function fdValue(P, ratePct, months, start, now = new Date(), comp = 4){
  const st = new Date(start + 'T00:00:00'), end = new Date(st.getFullYear(), st.getMonth() + months, st.getDate()), today = dateOnly(now);
  if(today >= end) return fdMaturity(P, ratePct, months, comp); if(today <= st) return P;
  const days = Math.round((today - st) / 864e5), r = ratePct/100;
  return comp ? P*Math.pow(1 + r/comp, comp*days/365) : P*(1 + r*days/365);
}
const rdAmtAt = (M, amts, i) => (amts && amts[i-1] != null && amts[i-1] !== '' && !isNaN(+amts[i-1])) ? +amts[i-1] : M;   // flexible RD: month i may differ
function rdMaturity(M, ratePct, months, comp = 4, amts){ const r = ratePct/100; let s = 0; for(let i = 1; i <= months; i++) s += rdAmtAt(M, amts, i)*Math.pow(1 + r/comp, comp*(months - i + 1)/12); return s; }
function rdInvested(h, now = new Date()){ if(!h.start) return 0; const k = rdDeposits(h.start, +h.months, now); let t = 0; for(let i = 1; i <= k; i++) t += rdAmtAt(+h.monthly, h.amts, i); return t; }
function rdDeposits(start, months, now = new Date()){ if(!start) return 0; const st = new Date(start + 'T00:00:00'), today = dateOnly(now); let k = 0; for(let i = 0; i < months; i++){ if(new Date(st.getFullYear(), st.getMonth() + i, st.getDate()) <= today) k++; else break; } return k; }
function rdValue(M, ratePct, months, start, now = new Date(), comp = 4, amts){
  if(!start) return 0;   // RD not started yet
  const st = new Date(start + 'T00:00:00'), end = new Date(st.getFullYear(), st.getMonth() + months, st.getDate()), today = dateOnly(now), r = ratePct/100;
  if(today >= end) return rdMaturity(M, ratePct, months, comp, amts); if(today < st) return 0;
  let s = 0; for(let i = 0; i < months; i++){ const d = new Date(st.getFullYear(), st.getMonth() + i, st.getDate()); if(d > today) break; s += rdAmtAt(M, amts, i + 1)*Math.pow(1 + r/comp, comp*monthsBetween(d, today)/12); } return s;
}
const HTYPES = { stocks:'Stocks', mf:'Mutual funds', gold:'Digital gold', fd:'Fixed deposit (FD)', rd:'Recurring deposit (RD)', bond:'Bonds', other:'Other' };
const holdingValue = (h, now) => h.type==='fd' ? fdValue(+h.principal, +h.rate, +h.months, h.start, now, h.comp ?? 4) : h.type==='rd' ? rdValue(+h.monthly, +h.rate, +h.months, h.start, now, h.comp ?? 4, h.amts) : (+h.value || 0);
const holdingInvested = (h, now) => h.type==='fd' ? +h.principal : h.type==='rd' ? rdInvested(h, now) : (+h.invested || 0);
function holdTotal(id){ return S.txns.filter(t => t.type==='hold' && !t.released && !t.reverted && t.from===id).reduce((x,t) => x + t.amount, 0); }
const invValue = (a, now) => net(a.id) + (a.holdings || []).reduce((x,h) => x + holdingValue(h, now), 0);   // cash + money on hold for IPOs + holdings
const invInvested = (a, now) => net(a.id) + (a.holdings || []).reduce((x,h) => x + holdingInvested(h, now), 0);
const matTxt = h => h.start ? fdate(maturityOf(h)) : 'when you start it';
function maturityOf(h){ if(!h.start) return null; const st = new Date(h.start + 'T00:00:00'); return new Date(st.getFullYear(), st.getMonth() + (+h.months||0), st.getDate()); }
function growthSeries(kind, A, rate, months, comp){   // value at the end of each year
  const pts = [], yrs = Math.ceil(months/12);
  for(let y = 0; y <= yrs; y++){ const m = Math.min(y*12, months); pts.push({ y:Math.min(y*12, months)/12, v: kind==='rd' ? (m ? rdMaturity(A, rate, m, comp) : 0) : fdMaturity(A, rate, m, comp), dep: kind==='rd' ? A*m : A }); }
  return pts;
}

function doMove(id, dir){

function saveIpo(){

function ipoResult(id, got){

    <div class="row"><button class="pri" onclick="ipoResult('${id}', parseFloat(mv('ir_a'))||0)">Save allotment</button><button onclick="closeModal()">Cancel</button></div>`);

    S.txns.push({ id:uid(), ts:Date.now(), type:'invest', amount:amt, desc:'IPO allotted: ' + o.name, cat:'Other', from:o.from, toName:(plat?.name || 'Shares') + ' (shares)', ipoId:id });

}
function ipoDel(id){ ask('Remove this IPO?', 'The hold is removed and the money counts as free again. Shares already added stay in Holdings.', 'Remove', () => { const o = (S.ipos||[]).find(x => x.id===id); if(o){ S.txns = S.txns.filter(t => !(t.id===o.txn && o.status==='pending')); S.ipos = S.ipos.filter(x => x.id!==id); } save(); render(); }, true); }
function ipoListHTML(){

function makeLogo(){

function nwData(now = new Date()){
  const act = S.accounts.filter(a => a.type!=='external'), bal = pplBal();
  const spendable = act.filter(a => ['bank','cash','wallet'].includes(a.type)).map(a => ({ name:a.name, v:net(a.id), kind:a.type, off:!!a.inactive }));
  const inv = act.filter(a => a.type==='invest' && !a.reserve).flatMap(a => { const l = (a.holdings || []).map(h => ({ name:`${a.name} · ${h.name || HTYPES[h.type]}`, v:holdingValue(h, now), kind:h.type })), c = net(a.id); if(Math.abs(c) > .004 || !l.length) l.unshift({ name:`${a.name} · balance`, v:c, kind:'invest' }); return l; });
  const recv = Object.keys(bal).filter(n => bal[n] > 0.004).map(n => ({ name:n, v:bal[n] })), owe = Object.keys(bal).filter(n => bal[n] < -0.004).map(n => ({ name:n, v:-bal[n] }));
  const cards = act.filter(a => a.type==='credit').map(a => ({ name:a.name, v:Math.max(0, -net(a.id)) })).filter(x => x.v > 0.004);
  const sum = l => l.reduce((x,i) => x + i.v, 0);
  const assets = sum(spendable) + sum(inv) + sum(recv), liab = sum(cards) + sum(owe);
  return { spendable, inv, recv, owe, cards, assets, liab, total:assets - liab, spend:sum(spendable), invTotal:sum(inv) };
}
function upcoming(days = 30){

    out.push({ d:x.d, vendor:x.f.vendor || x.f.title, amount:fxAmt(x.f, x.k), from:a ? a.name : '?', via:m ? (m.app || m.name) : '', kind:x.f.ppl ? 'Repayment' : x.f.emi ? 'EMI' : x.f.auto ? 'Autopay' : 'Due', accId:a ? a.id : null, auto:!!x.f.auto }); });
  S.accounts.filter(a => a.type==='credit' && !a.inactive).forEach(a => { const s = stmt(a); if(s && s.remMin > 0 && s.due - now < days*864e5) out.push({ d:s.due, vendor:a.name + ' bill (minimum)', amount:s.remMin, from:'Your bank', via:'', kind:'Card bill', accId:null }); });
  S.plans.filter(p => !p.done && p.due && new Date(p.due) - now < days*864e5).forEach(p => { const m = meth(p.methodId), a = m && acc(m.accountId); out.push({ d:new Date(p.due), vendor:p.desc, amount:p.amount, from:a ? a.name : '?', via:m ? (m.app || m.name) : '', kind:'Planned', accId:a ? a.id : null }); });
  return out.sort((x,y) => x.d - y.d);
}

/* ---------- card benefits: vouchers, OTT, spa, gym … with claimed / not claimed ---------- */
const BPER = { once:'One time', monthly:'Every month', quarterly:'Every quarter', yearly:'Every year' };
const BIDEAS = ['Prime Video / OTT','Fitness (Cult.fit)','Spa','Health check-up','Cab coupon','Golf','Gift voucher','Lounge access','Movie tickets'];
const benList = () => (S.benefits = S.benefits || []);
function benKey(b, d){ d = d || new Date(); const y = d.getFullYear(); return b.period==='monthly' ? ym(d) : b.period==='quarterly' ? y + '-Q' + (Math.floor(d.getMonth()/3) + 1) : b.period==='yearly' ? '' + y : 'once'; }
function benEnd(b, d){ d = d || new Date(); const y = d.getFullYear(), m = d.getMonth(), u = b.until ? new Date(b.until + 'T00:00:00') : null; let e = b.period==='monthly' ? new Date(y, m + 1, 0) : b.period==='quarterly' ? new Date(y, Math.floor(m/3)*3 + 3, 0) : b.period==='yearly' ? new Date(y, 11, 31) : u; if(u && e && u < e) e = u; return e; }
const benDone = (b, d) => (b.claims || []).filter(c => c.key===benKey(b, d)).length;
const benTimes = b => Math.max(1, b.times || 1);
const benLeft = b => Math.max(0, benTimes(b) - benDone(b));
const benEnded = b => !!(b.until && new Date(b.until + 'T23:59:59') < new Date());
function claimBen(id){ const b = benList().find(x => x.id===id); if(!b) return; if(benLeft(b) <= 0) return toast('Already fully claimed'); (b.claims = b.claims || []).push({ ts:Date.now(), key:benKey(b) }); save(); haptic(12); render(); toast('Marked as claimed'); }
function unclaimBen(id){ const b = benList().find(x => x.id===id); if(!b) return; const k = benKey(b), i = (b.claims || []).map(c => c.key).lastIndexOf(k); if(i < 0) return; b.claims.splice(i, 1); save(); render(); toast('Back to not claimed'); }
function benItem(a){

  const done = act.reduce((x, b) => x + Math.min(benDone(b), benTimes(b)), 0), tot = act.reduce((x, b) => x + benTimes(b), 0), left = act.reduce((x, b) => x + benLeft(b) * (b.worth || 0), 0);

  return { key:'ben:' + a.id, html: cw('ben:' + a.id, { br, cls:'', style:palStyle(br, a),
    front:`<div class="top"><div><div class="nm">${esc(a.name)}</div><div class="ty">Benefits · this period</div></div><div class="logo">${markA(a,34)}</div></div><div class="bot"><div class="bal">${done} of ${tot} claimed</div><div class="bar"><i style="width:${tot ? done/tot*100 : 0}%"></i></div><div class="meta"><span>${left ? mi(left, a) + ' still to use' : 'All used'}</span><span>${bs.length} benefit${bs.length > 1 ? 's' : ''}</span></div></div>`,

/* what each card gave in a calendar year: claimed perks + cashback - annual fee */
function benYearData(y){
  const now = new Date(), rows = {}, row = a => rows[a.id] = rows[a.id] || { a, perks:0, missed:0, cb:0, fee:a.fee || 0, items:[] };
  benList().forEach(b => { const a = acc(b.accId); if(!a) return; const r = row(a), cl = (b.claims || []).filter(c => new Date(c.ts).getFullYear()===y), got = cl.length * (b.worth || 0);
    let exp = 0; const made = new Date(b.ts || 0), per = (end, key) => { if(end < now && end >= new Date(made.getFullYear(), made.getMonth(), made.getDate()) && (!b.until || end <= new Date(b.until + 'T23:59:59'))) exp += benTimes(b) - Math.min(benTimes(b), (b.claims || []).filter(c => c.key===key).length); };
    if(b.period==='monthly') for(let m = 0; m < 12; m++) per(new Date(y, m + 1, 0, 23, 59), y + '-' + String(m + 1).padStart(2, '0'));
    else if(b.period==='quarterly') for(let q = 0; q < 4; q++) per(new Date(y, q*3 + 3, 0, 23, 59), y + '-Q' + (q + 1));
    else if(b.period==='yearly') per(new Date(y, 11, 31, 23, 59), '' + y);
    else if(b.until && new Date(b.until + 'T00:00:00').getFullYear()===y) per(new Date(b.until + 'T23:59:59'), 'once');
    r.perks += got; r.missed += exp * (b.worth || 0); if(cl.length || exp) r.items.push({ name:b.name, got:cl.length, worth:b.worth || 0 }); });
  live().filter(t => t.cb && new Date(t.ts).getFullYear()===y).forEach(t => { const m = meth(t.methodId), a = m && acc(m.accountId); if(a) row(a).cb += t.cb; });
  const list = Object.values(rows).map(r => Object.assign(r, { net: r.perks + r.cb - r.fee })).sort((x, z) => z.net - x.net), sum = k => list.reduce((x, r) => x + r[k], 0);
  return { list, perks:sum('perks'), cb:sum('cb'), fee:sum('fee'), missed:sum('missed'), net:sum('net') };
}

    if(inp.dataset.pw) return; inp.dataset.pw = '1'; const pin = inp.getAttribute('inputmode')==='numeric', meter = ['pn_a', 'dv_a', 'bk_a'].includes(inp.id) && inp.closest('label');
    const wrap = document.createElement('span'); wrap.style.cssText = 'position:relative;display:block'; inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp); inp.style.paddingRight = '56px';
    const eye = document.createElement('button'); eye.type = 'button'; eye.className = 'sm ghost'; eye.tabIndex = -1; eye.textContent = 'Show'; eye.style.cssText = 'position:absolute;right:4px;top:50%;transform:translateY(-50%)';
    eye.onclick = () => { const on = inp.type==='password'; inp.type = on ? 'text' : 'password'; eye.textContent = on ? 'Hide' : 'Show'; }; wrap.appendChild(eye);
    if(meter){ const m = document.createElement('div'); m.style.cssText = 'margin-top:6px;display:flex;align-items:center;gap:8px;font-size:.7rem'; m.innerHTML = '<span style="flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden"><i style="display:block;height:100%;width:0;transition:width .2s"></i></span><span class="pwt" style="min-width:150px"></span>'; wrap.parentNode.appendChild(m);
      inp.addEventListener('input', () => { const r = pwScore(inp.value, pin), bar = m.querySelector('i'), t = m.querySelector('.pwt'); if(!r){ bar.style.width = '0'; t.textContent = ''; return; } const c = ['#e0594f', '#e0a030', '#5fbf7a'][r.l]; bar.style.width = [34, 67, 100][r.l] + '%'; bar.style.background = c; t.textContent = r.t; t.style.color = c; }); }
  });
}
function secOpen(){ if(!S.dv) return go('sec'); dvEnsure(() => go('sec')); }
function rSec(){
  if(S.dv && !V.dv) return `<div class="card"><h2>Security & privacy <button class="sm ghost" onclick="go('settings')">Back</button></h2><div class="sub">This page is locked. Enter your details passphrase to open it.</div><button class="pri" onclick="dvEnsure(() => render())">Unlock</button></div>`;
  const c = S.sec || {}, dvBtn = S.dv ? `<button onclick="dvEnsure(() => go('details'))">Open details</button><button onclick="dvChangeModal()">Change passphrase</button><button class="bad" onclick="dvEraseModal()">Forgot? Erase</button>` : `<button class="pri" onclick="dvSetupModal(() => go('details'))">Create details vault</button>`;
  const row = (l, on, btn) => `<div class="row" style="justify-content:space-between;align-items:center"><span>${l} <span class="chip ${on ? 'g' : 'w'}">${on ? 'set' : 'not set'}</span></span>${btn}</div>`;
  return `<div class="card"><h2>Security & privacy <button class="sm ghost" onclick="go('settings')">Back</button></h2><div class="sub">Everything stays on this phone. ${NATIVE ? 'This app has no internet permission, and Android cloud backup is off.' : 'The Android app has no internet permission and Android cloud backup is off.'}</div></div>
  <div class="card"><h2>Your locks</h2>
    ${row('App PIN', !!S.lock, `<button class="sm" onclick="pinModal()">${S.lock ? 'Change' : 'Set'}</button>`)}
    ${row('Investments PIN', !!S.invLock, `<button class="sm" onclick="invPinModal()">${S.invLock ? 'Change' : 'Set'}</button>`)}
    ${row('Details passphrase', !!S.dv, '')}
    <div class="row">${dvBtn}</div>
    <div class="sub">3 wrong tries lock that lock for 1 minute, then 5, 30 and 60 minutes. Nothing is ever erased.</div></div>
  <div class="card"><h2>Screenshots</h2><label class="ck"><input type="checkbox" ${c.shot!==false ? 'checked' : ''} onchange="setShot(this.checked)"><span>Allow screenshots and screen recording</span></label><div class="sub">${NATIVE ? 'When off, Android also hides the app in the recent-apps view.' : 'Works in the Android app.'}</div></div>
  <div class="card"><h2>Intruder log</h2><div class="sub">After 2 wrong tries in a row: 3 photos (3 seconds apart) and/or 15 seconds of audio, locked with your details passphrase. No notification is shown – a banner appears inside the app, but the log opens only with your passphrase. With both switches off only the attempt is logged.${S.dv ? '' : ' <b>Create the details vault first.</b>'}</div>
    <label class="ck"><input type="checkbox" ${c.cam ? 'checked' : ''} onchange="this.checked ? intrEnable('cam') : intrDisable('cam')"><span>Take photos with the front camera</span></label>
    <label class="ck"><input type="checkbox" ${c.mic ? 'checked' : ''} onchange="this.checked ? intrEnable('mic') : intrDisable('mic')"><span>Record 15 seconds of audio</span></label>
    <div class="row"><button onclick="intrOpen()">Open log${V.intrNew ? ' (' + V.intrNew + ' new)' : ''}</button></div></div>
  <div class="card"><h2>Backups</h2><div class="sub">Every backup is locked with a password. ${S.rk ? 'Recovery key is on.' : 'You can add a recovery key – a spare code on paper for a forgotten password.'}</div>
    <div class="row"><button class="pri" onclick="exportJSON()">Make encrypted backup</button><button onclick="$('imp').click()">Restore</button><button onclick="pasteRestoreModal()">Paste text</button></div></div>`;
}

(function boot(){
  try{
    const cur = localStorage.getItem(KEY);
    if(cur) S = JSON.parse(cur);
    else { const old = localStorage.getItem(OLD_KEY); S = old ? migrate(JSON.parse(old)) : blank(); if(old) save(); }
  }catch(e){ S = blank(); }
  S.reminders = S.reminders || []; S.plans = S.plans || []; S.fixed = S.fixed || []; S.budgets = S.budgets || {}; S.cats = S.cats || []; S.people = S.people || [];
  V.hideNow = !!S.hideAll;
  if(!S.designV){ S.designV = 2; if(!S.theme || S.theme==='pastel') S.theme = 'noir'; save(); }
  upgradeData(); autoRecord();
  { const t0 = new URLSearchParams(location.search).get('tab'); if(['home','add','history','accounts','plan','insights','settings'].includes(t0)) V.tab = t0; }
  if(NATIVE && S.bio && !S.bio.native){ delete S.bio; save(); }   // a website fingerprint key does not work inside the app
  applyTheme(); render(); initVideo(); benYearAuto(); applySecure(); intrPrune().catch(() => {}); intrRefresh(); if(NATIVE) setTimeout(scheduleNotifs, 1200);
  if(S.lock){ V.unlocked = false; render(); showLock(() => { render(); setTimeout(maybePopup, 500); }, false); } else setTimeout(maybePopup, 800);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.theme==='auto' && applyTheme());
  document.addEventListener('visibilitychange', () => { if(!document.hidden && V.tab==='home' && !needsSetup() && !$('modal').classList.contains('on') && !$('calc').classList.contains('on')) render(); });
})();
